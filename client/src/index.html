<!DOCTYPE html>
<html>

<head><meta charset="utf-8">
  <title>Odyssey 2</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#13212a;color:#e8e6dc;font:16px system-ui}button,input{font:inherit;padding:12px;border:1px solid #50616a;border-radius:5px}button{background:#d4b675;color:#17232a;cursor:pointer}button:disabled{opacity:.5}.login{max-width:480px;margin:10vh auto;padding:32px;background:#20333d;border:1px solid #465963}.login input{display:block;width:100%;margin:16px 0}.login button{margin:12px 8px 0 0}h1{color:#d4b675;letter-spacing:5px}.game{height:100vh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:32px;padding:14px 24px}header strong{color:#d4b675;letter-spacing:4px}header button{margin-left:auto}canvas{display:block;flex:1;min-height:0;width:100%}footer{padding:12px 24px;color:#b6c6c9;font-size:14px}
  </style>
  <style>
    .playarea{display:flex;flex:1;min-height:0}.worldcanvas{width:0;flex:1}.inventory{width:270px;background:#20333d;padding:14px;overflow:auto}.inventory h3{margin:0 0 10px;color:#d4b675}.inventory-slot{border-bottom:1px solid #43565e;padding:8px 0;min-height:35px}.inventory-slot strong,.inventory-slot small{display:block;font-size:13px}.inventory-slot button{font-size:12px;padding:5px;margin:5px 5px 0 0}.empty{font-size:12px;color:#94a5ac}.health{color:#b3db88;white-space:nowrap}header{gap:18px}footer div{min-height:20px}
  </style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="stylesheet" href="game-ui.css"><link rel="stylesheet" href="launcher.css"><link rel="stylesheet" href="hud.css"></head>

<body>
  <script src="js/app.js"></script>
</body>

</html>
